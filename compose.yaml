services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fixpath
      POSTGRES_USER: fixpath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes:
      - fixpath_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixpath"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://fixpath:${POSTGRES_PASSWORD}@db:5432/fixpath
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET of at least 32 characters}
      ENVIRONMENT: development
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
    depends_on:
      db:
        condition: service_healthy
volumes:
  fixpath_db:
